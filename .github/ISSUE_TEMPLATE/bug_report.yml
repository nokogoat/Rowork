name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste tokens, cookies or `.env` files.**
  - type: input
    id: version
    attributes:
      label: Rowork version
      description: Output of `rowork --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact command, and what you expected.
      placeholder: "rowork add:player-data ..."
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Re-run with `--verbose` and paste the result.
      render: shell
    validations:
      required: true
