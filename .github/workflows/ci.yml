name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing platform, not just the first one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          # Guards the `engines.node` floor declared in package.json.
          - os: ubuntu-latest
            node: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Scaffold a project end to end
        run: npm run test:smoke

      - name: Verify no process survives rowork dev
        run: npm run test:orphan

  # Single stable context for branch protection to require.
  #
  # Requiring the matrix jobs directly would pin their generated names
  # ("build (ubuntu-latest, node 22)") into the repository ruleset: changing an
  # OS or a Node version would then leave protection waiting forever on a check
  # that no longer runs, blocking every pull request. This job depends on the
  # whole matrix and exposes one name that never changes.
  ci-success:
    name: ci-success
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify every matrix job succeeded
        if: needs.build.result != 'success'
        run: |
          echo "matrix result: ${{ needs.build.result }}"
          exit 1
      - run: echo "All matrix jobs passed."
